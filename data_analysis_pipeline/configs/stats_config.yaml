global:
  plot_only: true

plotting:
  save_cutout_example: true
  example_date: "20101010"
  fig_save_dir: ${env:DATA_FIGS_DIR}
  show: false
  save: true
  visualize_data: true
  visualize_aggregated: true
  plot_stats: [mean, std, min, max] # Which statistics to plot
  zero_floor_mm_day: 0.001

statistics:
  streaming: true # Whether to use streaming statistics computation (True) or load all data into memory (False)
  save_global_pixel_stats: true
  stats_save_dir: ${env:STATS_SAVE_DIR}
  aggregate: false
  print_results: ["global"]
  save_full_stats_npz: true

  # NEW — needed for asinh_zscore and boxcox_zscore
  log_stats: true
  asinh_scale: 2.0
  boxcox_lambda: 0.3
  boxcox_eps: 0.01
  
data:
  aggregation_time: monthly
  data_dir: ${env:DATA_DIR}
  n_workers: ${env:SLURM_CPUS_PER_TASK}
  split: train # 'train', 'val', 'test' or 'all'
  verbose: true # Whether to enable verbose logging during data loading (only for debugging, slows down processing)

highres:
  model: DANRA 
  variables: ['prcp'] #'temp', 
  agg_methods: ['sum'] #'mean', 
  domain_size: [589, 789]
  crop_region: [0, 589, 0, 789]

lowres:
  model: ERA5
  condition_variables: ['prcp', 'ewvf', 'nwvf', 'cape', 'msl', 'z_pl_1000', 'z_pl_250', 'z_pl_500', 'z_pl_850'] # ['prcp', 'temp', 'ewvf', 'nwvf', 'cape', ....] (ERA5 variables) 'temp', 
  agg_methods: ['sum', 'mean', 'mean', 'mean', 'mean', 'mean', 'mean', 'mean', 'mean'] # 'mean', 
  domain_size: [589, 789]
  crop_region: [0, 589, 0, 789]