# cfg/era5_pipeline.yaml
area: [60, -80, 40, 40]        # N,W,S,E  (edit!)
dataset: reanalysis-era5-pressure-levels
format: netcdf
variables:
  temperature:
    short: t_pl
    daily_stat: daymean
  specific_humidity:
    short: q_pl
    daily_stat: daymean
pressure_levels: [850]  # Pressure levels in hPa
years: [1991, 2020]            # inclusive range
max_workers: 3
tmp_dir: /tmp/era5_downloads
grid_file: ${env:ERA5_TMP_DIR}/grid/mygrid_danra_small
weights_file: ${env:ERA5_TMP_DIR}/weights/ERA5_to_DANRA_bil_weights_new.nc
lumi:
  user:  quistgaa
  host:  lumi.csc.fi
  raw_dir:   ${env:ERA5_TMP_DIR}/raw/{var}/{plev}
  daily_dir: ${env:ERA5_TMP_DIR}/daily/{var}/
  npz_dir:   ${env:ERA5_TMP_DIR}/npz/{var}/