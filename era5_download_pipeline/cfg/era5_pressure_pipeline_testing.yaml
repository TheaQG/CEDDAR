# cfg/era5_pipeline.yaml
area: [70, -20, 45, 35]        # N,W,S,E  (edit!)
dataset: reanalysis-era5-pressure-levels
format: netcdf
variables:
  geopotential:
    short: z_pl   # used in paths
    nc_var: z     # variable name in netcdf
    daily_stat: daymean
pressure_levels: [1000] # , 850, 500, 250]  # Pressure levels in hPa
years: [1991, 1992]            # inclusive range
max_workers: 3
tmp_dir: /tmp/era5_downloads
grid_file: ${env:ERA5_TMP_DIR}/grid/mygrid_danra_small
weights_file: ${env:ERA5_TMP_DIR}/weights/ERA5_to_DANRA_bil_weights_new.nc
delete_on_fly: false
lumi:
  user:  your_username
  host:  lumi.csc.fi
  raw_dir:   ${env:ERA5_TMP_DIR}/raw/{var}/{plev}
  daily_dir: ${env:ERA5_TMP_DIR}/daily/{var}/
  npz_dir:   ${env:ERA5_TMP_DIR}/npz/{var}/
  key: /path/to/your/ssh/key